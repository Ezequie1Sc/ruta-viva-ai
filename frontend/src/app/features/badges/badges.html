<div class="min-h-screen bg-[#f7f8f5] text-slate-900">

  <header class="mx-auto flex max-w-6xl items-center px-6 py-6">
    <a routerLink="/" class="text-sm text-slate-500">
      ← Ruta Viva <b class="text-emerald-600">AI</b>
    </a>
  </header>

  <main class="mx-auto max-w-6xl px-6 pb-16">

    <div>
      <h1 class="text-4xl font-semibold tracking-tight">
        Mis insignias
      </h1>

      <p class="mt-2 text-slate-500">
        Descubre, camina y desbloquea nuevas insignias.
      </p>
    </div>

    <section class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

      @for (badge of badges; track badge.file) {

        <article
          class="rounded-3xl border border-slate-200 bg-white p-5 text-center shadow-sm"
          [class.opacity-50]="!badge.unlocked"
        >

          <div class="flex h-32 items-center justify-center">
            <img
              [src]="'ruta-viva-badges/' + badge.file"
              [alt]="badge.name"
              class="h-28 w-28 object-contain"
            />
          </div>

          <h2 class="mt-3 text-sm font-semibold">
            {{ badge.name }}
          </h2>

          <p class="mt-1 text-xs text-slate-400">
            {{ badge.progress }}
          </p>

          <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-slate-100">
            <div
              class="h-full rounded-full bg-emerald-500"
              [style.width]="badge.unlocked ? '100%' : '25%'"
            ></div>
          </div>

        </article>

      }

    </section>

  </main>

</div>
