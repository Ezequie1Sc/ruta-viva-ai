<div class="min-h-screen bg-[#f7f8f5] text-slate-900">

  <header class="mx-auto flex max-w-4xl items-center px-6 py-6">
    <a
      routerLink="/"
      class="flex items-center gap-3 text-sm font-medium text-slate-500"
    >
      ←
      <span>
        Ruta Viva <b class="text-emerald-600">AI</b>
      </span>
    </a>
  </header>

  <main class="mx-auto max-w-4xl px-6 pb-16">

    <div class="mb-10">
      <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-emerald-600">
        Nueva aventura
      </p>

      <h1 class="text-4xl font-semibold tracking-tight">
        Crear una aventura
      </h1>

      <p class="mt-2 text-slate-500">
        Cuéntanos un poco sobre tu próxima ruta.
      </p>
    </div>

    <section class="space-y-10">

      <!-- DURACIÓN -->

      <div>
        <h2 class="mb-4 text-lg font-semibold">
          ¿Cuánto tiempo tienes?
        </h2>

        <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">

          <button
            type="button"
            (click)="selectDuration(15)"
            [class.selected-option]="duration === 15"
            class="option-card"
          >
            <span class="block text-2xl font-semibold">
              15
            </span>

            <span class="text-sm text-slate-400">
              minutos
            </span>
          </button>

          <button
            type="button"
            (click)="selectDuration(30)"
            [class.selected-option]="duration === 30"
            class="option-card"
          >
            <span class="block text-2xl font-semibold">
              30
            </span>

            <span class="text-sm text-slate-400">
              minutos
            </span>
          </button>

          <button
            type="button"
            (click)="selectDuration(45)"
            [class.selected-option]="duration === 45"
            class="option-card"
          >
            <span class="block text-2xl font-semibold">
              45
            </span>

            <span class="text-sm text-slate-400">
              minutos
            </span>
          </button>

          <button
            type="button"
            (click)="selectDuration(60)"
            [class.selected-option]="duration === 60"
            class="option-card"
          >
            <span class="block text-2xl font-semibold">
              60
            </span>

            <span class="text-sm text-slate-400">
              minutos
            </span>
          </button>

        </div>
      </div>


      <!-- TIPO -->

      <div>

        <h2 class="mb-4 text-lg font-semibold">
          ¿Qué quieres descubrir?
        </h2>

        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">

          <button
            type="button"
            (click)="selectType('nature')"
            [class.selected-option]="type === 'nature'"
            class="option-card option-card-large text-left"
          >
            <span class="text-2xl">
              🌿
            </span>

            <span class="mt-3 block font-semibold">
              Naturaleza
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Descubre plantas, paisajes y sonidos.
            </span>
          </button>


          <button
            type="button"
            (click)="selectType('culture')"
            [class.selected-option]="type === 'culture'"
            class="option-card option-card-large text-left"
          >
            <span class="text-2xl">
              🏛️
            </span>

            <span class="mt-3 block font-semibold">
              Cultura
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Descubre historias y lugares.
            </span>
          </button>


          <button
            type="button"
            (click)="selectType('walk')"
            [class.selected-option]="type === 'walk'"
            class="option-card option-card-large text-left"
          >
            <span class="text-2xl">
              🚶
            </span>

            <span class="mt-3 block font-semibold">
              Caminata
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Simplemente sal y camina.
            </span>
          </button>


          <button
            type="button"
            (click)="selectType('surprise')"
            [class.selected-option]="type === 'surprise'"
            class="option-card option-card-large text-left"
          >
            <span class="text-2xl">
              ✦
            </span>

            <span class="mt-3 block font-semibold">
              Sorpresa
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Deja que la IA decida.
            </span>
          </button>

        </div>

      </div>


      <!-- DIFICULTAD -->

      <div>

        <h2 class="mb-4 text-lg font-semibold">
          Dificultad
        </h2>

        <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">

          <button
            type="button"
            (click)="selectDifficulty('easy')"
            [class.selected-option]="difficulty === 'easy'"
            class="option-card"
          >
            <span class="block font-semibold">
              Fácil
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Exploración relajada
            </span>
          </button>


          <button
            type="button"
            (click)="selectDifficulty('medium')"
            [class.selected-option]="difficulty === 'medium'"
            class="option-card"
          >
            <span class="block font-semibold">
              Media
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Un poco más de reto
            </span>
          </button>


          <button
            type="button"
            (click)="selectDifficulty('hard')"
            [class.selected-option]="difficulty === 'hard'"
            class="option-card"
          >
            <span class="block font-semibold">
              Difícil
            </span>

            <span class="mt-1 block text-sm text-slate-400">
              Para exploradores
            </span>
          </button>

        </div>

      </div>


      <!-- RESUMEN -->

      <div class="rounded-2xl border border-slate-200 bg-white p-5">

        <p class="text-sm font-semibold">
          Tu aventura
        </p>

        <div class="mt-4 grid grid-cols-3 gap-4 text-center">

          <div>
            <p class="text-xl font-semibold">
              {{ duration }}
            </p>

            <p class="text-xs text-slate-400">
              minutos
            </p>
          </div>

          <div>
            <p class="text-xl font-semibold">
              {{ type }}
            </p>

            <p class="text-xs text-slate-400">
              tipo
            </p>
          </div>

          <div>
            <p class="text-xl font-semibold">
              {{ difficulty }}
            </p>

            <p class="text-xs text-slate-400">
              dificultad
            </p>
          </div>

        </div>

      </div>


      <!-- BOTÓN -->

      <button
        type="button"
        (click)="createAdventure()"
        class="w-full rounded-2xl bg-[#064e3b] px-6 py-4 font-semibold text-white transition hover:bg-[#053d2f]"
      >
        Crear aventura →
      </button>

    </section>

  </main>

</div>
